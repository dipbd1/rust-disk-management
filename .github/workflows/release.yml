name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows-installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # createUpdaterArtifacts + pubkey require TAURI_SIGNING_PRIVATE_KEY.
      # When the secret is missing, merge a config overlay so MSI/NSIS still build.
      - name: Resolve tauri build args
        id: tauri_args
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "args=--bundles msi,nsis" >> "$GITHUB_OUTPUT"
            echo "updater=signed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/ci-unsigned-updater.json
            echo "args=--bundles msi,nsis --config src-tauri/ci-unsigned-updater.json" >> "$GITHUB_OUTPUT"
            echo "updater=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset; building installers without updater signatures or latest.json. See RELEASING.md."
          fi

      - name: Build Windows installers (MSI + NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required for .sig files and latest.json.
          # Leave unset to ship unsigned installers without updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Authenticode — leave unset to ship without code signing.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-draft-{0}', github.run_number) }}
          releaseName: Liquid Storage Manager ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-draft-{0}', github.run_number) }}
          releaseBody: |
            Windows installers for Liquid Storage Manager.

            - MSI and NSIS packages (x64)
            - Windows-only; admin elevation optional for faster NTFS MFT scans
            - Auto-update: when signing secrets are set, this release also gets `latest.json` and `.sig` files for the in-app updater
            - See CHANGELOG.md, RELEASING.md, and the README install notes

            Draft release — review artifacts before publishing.
            The in-app updater reads `releases/latest/download/latest.json`, so publish (do not leave draft-only) when users should receive the update.
          releaseDraft: true
          prerelease: false
          # uploadUpdaterJson / uploadUpdaterSignatures default to true; they are no-ops without .sig files.
          updaterJsonPreferNsis: true
          args: ${{ steps.tauri_args.outputs.args }}
