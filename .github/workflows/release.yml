name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows-installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Tag pushes use the pushed tag (e.g. v0.1.1). Manual runs use the
      # version from tauri.conf.json so draft names stay in sync with the bump.
      - name: Resolve release identity
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v${VER}-draft-${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Liquid Storage Manager ${TAG}" >> "$GITHUB_OUTPUT"

      # createUpdaterArtifacts + pubkey require TAURI_SIGNING_PRIVATE_KEY.
      # When the secret is missing, merge a config overlay so MSI/NSIS still build.
      - name: Resolve tauri build args
        id: tauri_args
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "args=--bundles msi,nsis" >> "$GITHUB_OUTPUT"
            echo "updater=signed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/ci-unsigned-updater.json
            echo "args=--bundles msi,nsis --config src-tauri/ci-unsigned-updater.json" >> "$GITHUB_OUTPUT"
            echo "updater=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset; building installers without updater signatures or latest.json. See RELEASING.md."
          fi

      - name: Build Windows installers (MSI + NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required for .sig files and latest.json.
          # Leave unset to ship unsigned installers without updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Authenticode — leave unset to ship without code signing.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: |
            ## Liquid Storage Manager ${{ steps.release_meta.outputs.tag }}

            Windows installers (x64):

            - **NSIS** setup (`.exe`) — preferred for in-app updates
            - **MSI** (WiX)

            Notes:

            - Windows-only; admin elevation is optional (faster NTFS MFT scans)
            - When `TAURI_SIGNING_PRIVATE_KEY` is set, this draft also includes `.sig` files and `latest.json` for the in-app updater
            - The updater endpoint is `releases/latest/download/latest.json` — **publish** this draft when users should receive the update (drafts are not served by `/releases/latest/`)
            - Changelog: see `CHANGELOG.md`. Signing / cut steps: see `RELEASING.md`.

            Draft release — review artifacts before publishing.
          releaseDraft: true
          prerelease: false
          # uploadUpdaterJson / uploadUpdaterSignatures default to true; they are no-ops without .sig files.
          updaterJsonPreferNsis: true
          args: ${{ steps.tauri_args.outputs.args }}
